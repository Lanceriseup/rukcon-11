<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Type — Display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding: 24px 28px; background: var(--ink-50); }
  .eyebrow { display:block; font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold-500); margin-bottom: 8px; }
  .specimen { font-family: 'Montserrat', sans-serif; font-weight: 900; line-height: 0.95; letter-spacing: -0.02em; text-transform: uppercase; color: var(--ink-900); margin: 0; font-size: 76px; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--ink-500); margin-top: 14px; }
</style>
</head>
<body>
  <span class="eyebrow">Display · Montserrat Black 900</span>
  <h1 class="specimen">ALL IN.</h1>
  <div class="meta">Montserrat 900 · uppercase · tracking −0.02em · used for hero headlines and the RUKCON wordmark</div>
</body>
</html>
