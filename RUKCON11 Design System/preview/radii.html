<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding: 22px 26px; font-family: var(--font-body); background: var(--ink-50); }
  .row { display:flex; gap: 18px; align-items:flex-end; }
  .tile { display:flex; flex-direction:column; gap: 8px; align-items:center; }
  .box { width: 76px; height: 56px; background: var(--ink-900); border: 1px solid var(--ink-900); }
  .gold { background: var(--gold-400); border-color: var(--gold-400); }
  .pill { width: 110px; height: 32px; background: var(--teal-400); border-radius: 999px; display:flex; align-items:center; justify-content:center; color:white; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--ink-500); text-align:center; line-height: 1.3; }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--ink-900); font-weight: 600; }
</style>
</head>
<body>
<div class="row">
  <div class="tile"><div class="box" style="border-radius: 0"></div><div class="meta"><div class="name">--r-none</div>0px</div></div>
  <div class="tile"><div class="box" style="border-radius: 2px"></div><div class="meta"><div class="name">--r-sm</div>2px · cards</div></div>
  <div class="tile"><div class="box gold" style="border-radius: 4px"></div><div class="meta"><div class="name">--r-md</div>4px · buttons</div></div>
  <div class="tile"><div class="box" style="border-radius: 8px"></div><div class="meta"><div class="name">--r-lg</div>8px · sparingly</div></div>
  <div class="tile"><div class="pill">CHIP</div><div class="meta"><div class="name">--r-pill</div>tags only</div></div>
</div>
</body>
</html>
