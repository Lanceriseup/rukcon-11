<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Type — Weights</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding: 20px 24px; background: var(--ink-50); font-family: 'Montserrat', sans-serif; color: var(--ink-900); }
  .row { display:flex; align-items: baseline; gap: 12px; padding: 4px 0; }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--ink-500); width: 110px; flex-shrink:0; }
  .sample { font-size: 22px; line-height: 1.2; }
</style>
</head>
<body>
  <div class="row"><span class="lbl">100 · Thin</span><span class="sample" style="font-weight:100">RUKCON Eleven</span></div>
  <div class="row"><span class="lbl">300 · Light</span><span class="sample" style="font-weight:300">RUKCON Eleven</span></div>
  <div class="row"><span class="lbl">400 · Regular</span><span class="sample" style="font-weight:400">RUKCON Eleven</span></div>
  <div class="row"><span class="lbl">500 · Medium</span><span class="sample" style="font-weight:500">RUKCON Eleven</span></div>
  <div class="row"><span class="lbl">600 · SemiBold</span><span class="sample" style="font-weight:600">RUKCON Eleven</span></div>
  <div class="row"><span class="lbl">700 · Bold</span><span class="sample" style="font-weight:700">RUKCON Eleven</span></div>
  <div class="row"><span class="lbl">800 · ExtraBold</span><span class="sample" style="font-weight:800">RUKCON Eleven</span></div>
  <div class="row"><span class="lbl">900 · Black</span><span class="sample" style="font-weight:900">RUKCON Eleven</span></div>
</body>
</html>
