<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Color — Ink (neutrals)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding: 20px; font-family: var(--font-body); background: var(--ink-50); }
  .row { display:grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  .swatch { aspect-ratio: 1.05/1; border-radius: var(--r-sm); display:flex; flex-direction:column; justify-content:flex-end; padding: 8px 10px; border:1px solid rgba(0,0,0,0.08); position:relative; }
  .swatch .num { font-family: var(--font-mono); font-size: 11px; font-weight: 600; }
  .swatch .hex { font-family: var(--font-mono); font-size: 10px; opacity: 0.85; }
  .dark .num, .dark .hex { color: white; }
  .swatch.note::before { content: attr(data-note); position:absolute; top:8px; left:10px; font-family: var(--font-body); font-size: 9px; letter-spacing: 0.14em; font-weight: 700; text-transform: uppercase; opacity: 0.7; }
</style>
</head>
<body>
<div class="row">
  <div class="swatch dark note" data-note="Logo BG" style="background:#0A0A0B"><span class="num">950</span><span class="hex">#0A0A0B</span></div>
  <div class="swatch dark note" data-note="Default" style="background:#141414"><span class="num">900</span><span class="hex">#141414</span></div>
  <div class="swatch dark" style="background:#2D2D2F"><span class="num">700</span><span class="hex">#2D2D2F</span></div>
  <div class="swatch dark" style="background:#5A5A5E"><span class="num">500</span><span class="hex">#5A5A5E</span></div>
  <div class="swatch" style="background:#A3A3A8"><span class="num">300</span><span class="hex">#A3A3A8</span></div>
  <div class="swatch" style="background:#E8E8E9"><span class="num">100</span><span class="hex">#E8E8E9</span></div>
  <div class="swatch note" data-note="Paper" style="background:#F5F4F0"><span class="num">50</span><span class="hex">#F5F4F0</span></div>
</div>
</body>
</html>
