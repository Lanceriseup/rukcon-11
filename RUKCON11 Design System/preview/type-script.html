<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Type — Script</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&display=swap" rel="stylesheet">
<style>
  body { margin:0; padding: 26px 28px; background: var(--ink-900); color: white; font-family: 'Montserrat', sans-serif; }
  .eyebrow { display:block; font-size: 10px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold-300); margin-bottom: 6px; }
  .stage { position: relative; display: inline-block; padding: 10px 14px 8px; }
  .brush { position:absolute; inset: 12% -6% 6% -6%; background: var(--teal-400); z-index: 0;
           clip-path: polygon(2% 38%, 6% 18%, 16% 8%, 30% 14%, 48% 4%, 66% 12%, 82% 8%, 94% 22%, 99% 56%, 92% 80%, 78% 92%, 62% 84%, 44% 94%, 26% 86%, 12% 90%, 3% 70%); }
  .script { position: relative; z-index: 1; font-family: 'Caveat Brush', 'Permanent Marker', cursive; font-size: 88px; line-height: 0.95; color: white; margin: 0; transform: rotate(-5deg); display:inline-block; letter-spacing: 0.01em; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--ink-300); margin-top: 22px; max-width: 580px; line-height: 1.55; }
  .meta b { color: var(--gold-300); font-weight: 600; }
</style>
</head>
<body>
  <span class="eyebrow">Accent script · Caveat Brush 400</span>
  <div class="stage"><span class="brush"></span><h2 class="script">All In</h2></div>
  <p class="meta"><b>The logo's "ALL IN" mark is a custom hand-lettering — use the logo art for it.</b> Caveat Brush is the supporting fallback for short script accents in new material (e.g. "Together." on couple-facing pieces). Max 3 words. Never set body copy in script.</p>
</body>
</html>
