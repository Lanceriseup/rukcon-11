<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Logo — Primary</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; font-family: 'Montserrat', sans-serif; background: var(--ink-50); }
  .card { display:grid; grid-template-columns: 1fr 1fr; min-height: 220px; }
  .pane { display:flex; align-items:center; justify-content:center; padding: 28px; position: relative; }
  .light { background: var(--ink-50); }
  .dark  { background: var(--ink-900); }
  .pane img { max-width: 100%; max-height: 160px; object-fit: contain; }
  .lbl { position:absolute; top:0; left:0; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; padding: 10px 12px; font-weight: 600; }
  .light .lbl { color: var(--ink-500); }
  .dark .lbl  { color: var(--ink-300); }
</style>
</head>
<body>
<div class="card">
  <div class="pane light"><span class="lbl">On Paper</span><img src="../assets/logo-primary-light.png" alt="RUKCON11 ALL IN — primary"></div>
  <div class="pane dark"><span class="lbl">On Ink</span><img src="../assets/logo-primary-dark.png" alt="RUKCON11 ALL IN — primary"></div>
</div>
</body>
</html>
