<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Color — Teal scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding: 20px; font-family: var(--font-body); background: var(--ink-50); }
  .row { display:grid; grid-template-columns: repeat(8, 1fr); gap: 10px; }
  .swatch { aspect-ratio: 1.05/1; border-radius: var(--r-sm); display:flex; flex-direction:column; justify-content:flex-end; padding: 8px 10px; border:1px solid rgba(0,0,0,0.08); position:relative; }
  .swatch.brand::after { content:"BRAND"; position:absolute; top:8px; right:8px; font-size: 9px; letter-spacing: 0.14em; font-weight: 700; color: var(--ink-950); background: rgba(255,255,255,0.6); padding: 2px 5px; border-radius: 2px;}
  .swatch .num { font-family: var(--font-mono); font-size: 11px; font-weight: 600; }
  .swatch .hex { font-family: var(--font-mono); font-size: 10px; opacity: 0.85; }
  .dark .num, .dark .hex { color: white; }
</style>
</head>
<body>
<div class="row">
  <div class="swatch" style="background:#E2F3F4"><span class="num">50</span><span class="hex">#E2F3F4</span></div>
  <div class="swatch" style="background:#B0DEE0"><span class="num">100</span><span class="hex">#B0DEE0</span></div>
  <div class="swatch" style="background:#7BC6CB"><span class="num">200</span><span class="hex">#7BC6CB</span></div>
  <div class="swatch" style="background:#46AEB4"><span class="num">300</span><span class="hex">#46AEB4</span></div>
  <div class="swatch brand dark" style="background:#1FA0A8"><span class="num">400</span><span class="hex">#1FA0A8</span></div>
  <div class="swatch dark" style="background:#168891"><span class="num">500</span><span class="hex">#168891</span></div>
  <div class="swatch dark" style="background:#0F6970"><span class="num">600</span><span class="hex">#0F6970</span></div>
  <div class="swatch dark" style="background:#094249"><span class="num">700</span><span class="hex">#094249</span></div>
</div>
</body>
</html>
