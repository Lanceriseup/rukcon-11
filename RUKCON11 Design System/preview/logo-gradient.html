<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Logo — Gradient</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; font-family: var(--font-body); background: var(--ink-50); }
  .card { display:grid; grid-template-columns: 1fr 1fr; min-height: 200px; }
  .pane { display:flex; align-items:center; justify-content:center; padding: 24px; position:relative; }
  .light { background: var(--ink-50); }
  .dark  { background: var(--ink-900); }
  .pane img { max-width: 100%; max-height: 140px; object-fit: contain; }
  .lbl { position:absolute; top:0; left:0; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; padding: 8px 10px; }
  .light .lbl { color: var(--ink-500); }
  .dark .lbl  { color: var(--ink-300); }
</style>
</head>
<body>
<div class="card">
  <div class="pane light"><span class="lbl">Couple-facing · Paper</span><img src="../assets/logo-gradient-light-v2.png" alt="RUKCON11 gradient"></div>
  <div class="pane dark"><span class="lbl">Couple-facing · Ink</span><img src="../assets/logo-gradient-dark-v2.png" alt="RUKCON11 gradient"></div>
</div>
</body>
</html>
