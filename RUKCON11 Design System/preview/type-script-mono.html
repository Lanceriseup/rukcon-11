<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Type — Script & Mono</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding: 22px 26px; font-family: var(--font-body); background: var(--ink-50); display:grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .meta { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-500); margin-bottom: 8px; }
  .script { font-family: var(--font-script); font-size: 56px; line-height: 1; color: var(--ink-900); transform: rotate(-4deg); display: inline-block; }
  .script-note { font-size: 11px; color: var(--ink-500); margin-top: 14px; max-width: 280px; line-height: 1.45; }
  .mono { font-family: var(--font-mono); font-size: 14px; color: var(--ink-900); }
  .mono-row { display:flex; flex-direction:column; gap: 4px; }
</style>
</head>
<body>
<div>
  <div class="meta">Script · Permanent Marker</div>
  <span class="script">All In</span>
  <p class="script-note">Graphic accent only. Max 3 words. Never set body copy in script.</p>
</div>
<div>
  <div class="meta">Mono · JetBrains Mono</div>
  <div class="mono-row">
    <span class="mono">RUKCON-2026-0011</span>
    <span class="mono">14:30 · Salon B</span>
    <span class="mono">--accent: #C99B30</span>
  </div>
</div>
</body>
</html>
