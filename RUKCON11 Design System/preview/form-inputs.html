<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Form inputs</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding: 22px; background: var(--ink-50); font-family: var(--font-body); }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
  label { display:block; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; color: var(--ink-700); margin-bottom: 6px; }
  input, select { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid var(--border-strong); border-radius: var(--r-sm); background: white; font-family: var(--font-body); font-size: 14px; color: var(--ink-900); transition: border-color 200ms; }
  input:focus, select:focus { outline: 0; border-color: var(--gold-400); box-shadow: 0 0 0 3px rgba(201,155,48,0.18); }
  .check { display:flex; align-items:center; gap: 8px; font-size: 13px; color: var(--ink-700); }
  .check input { width: 16px; accent-color: var(--gold-400); }
  .help { font-size: 11px; color: var(--ink-500); margin-top: 4px; }
</style>
</head>
<body>
<div class="grid">
  <div><label>Name</label><input value="Marcus Vale"></div>
  <div><label>Partner's name</label><input placeholder="Optional"></div>
  <div><label>Company</label><input value="Vale Capital"></div>
  <div><label>Tier</label><select><option>Founders' Table</option><option>Operator</option><option>Guest</option></select></div>
  <div style="grid-column:1/3" class="check"><input type="checkbox" checked><span>Both attending — couples programming on Day 2</span></div>
</div>
</body>
</html>
