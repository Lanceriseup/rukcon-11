<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Voice — sample copy</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding: 24px 28px; background: var(--ink-900); color: var(--ink-50); font-family: var(--font-body); }
  .eb { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold-300); margin-bottom: 14px; display:block; }
  .quote { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; font-size: 28px; line-height: 1.05; margin: 0 0 10px; }
  .sub { font-size: 14px; line-height: 1.55; color: var(--ink-200); margin: 0 0 18px; max-width: 580px; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--gold-300); }
</style>
</head>
<body>
  <span class="eb">Voice · Hero opener</span>
  <h2 class="quote">You're not here to network.</h2>
  <p class="sub">You're here because the people you needed to meet four years ago are sitting two seats over.</p>
  <span class="meta">Sept 14 · Aspen · By invitation</span>
</body>
</html>
