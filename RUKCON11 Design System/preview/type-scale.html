<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Type — Body & scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding: 20px 24px; background: var(--ink-50); font-family: 'Montserrat', sans-serif; color: var(--ink-900); }
  .row { display:flex; align-items: baseline; gap: 16px; padding: 8px 0; border-bottom: 1px dashed rgba(0,0,0,0.08); }
  .row:last-child { border:0; }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--ink-500); width: 80px; flex-shrink:0; }
  .sample { color: var(--ink-900); }
</style>
</head>
<body>
  <div class="row"><span class="lbl">H1 / 900</span><span class="sample" style="font-weight:900; text-transform:uppercase; font-size:42px; line-height:1; letter-spacing:-0.02em;">Eleven years.</span></div>
  <div class="row"><span class="lbl">H3 / 700</span><span class="sample" style="font-weight:700; text-transform:uppercase; font-size:22px;">Section heading</span></div>
  <div class="row"><span class="lbl">Lede / 500</span><span class="sample" style="font-weight:500; font-size:16px; line-height:1.5;">Three days. No panels. No badges that say "VP of Synergy."</span></div>
  <div class="row"><span class="lbl">Body / 400</span><span class="sample" style="font-weight:400; font-size:14px; line-height:1.6; color:var(--ink-700);">You're here because the people you needed to meet four years ago are sitting two seats over.</span></div>
  <div class="row"><span class="lbl">Small / 500</span><span class="sample" style="font-weight:500; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-500);">Sept 14 · Aspen · By invitation</span></div>
</body>
</html>
